project:
  name: spotify-cares-support
  brand: SpotifyCares
  random_seed: 42

data:
  source: thoughtvector/customer-support-on-twitter
  support_author_id: SpotifyCares
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  labels_dir: data/labels

extraction:
  input_path: data/raw/twcs.csv
  output_dir: data/processed
  temp_database: data/interim/spotifycares_index.sqlite3
  chunk_size: 50000
  audit_example_count: 5

preprocessing:
  examples_path: data/processed/support_examples.parquet
  relevant_tweets_path: data/processed/relevant_tweets.parquet
  conversations_path: data/processed/conversations.parquet
  output_dir: data/processed/splits
  version: spotify-preprocess-v1
  train_fraction: 0.70
  development_fraction: 0.15
  test_fraction: 0.15
  near_duplicate_threshold: 0.92
  near_duplicate_min_chars: 20
  shingle_size: 4
  candidate_keys: 4
  max_block_size: 100
  discovery_sample_size: 400
  safe_url_domains:
    - spotify.com
    - spoti.fi

annotation:
  taxonomy_path: configs/taxonomy.yaml
  guide_path: docs/annotation_guide.md
  split_dir: data/processed/splits
  output_dir: data/labels/annotation
  training_queue_size: 300
  development_queue_size: 80
  golden_random_size: 150
  golden_challenge_size: 50
  training_pilot_size: 30
  machine_model: gemini-2.5-flash
  machine_provider: gemini
  groq_model: openai/gpt-oss-20b
  groq_prompt_path: configs/machine_annotation_prompt_v3.txt
  groq_prompt_profile: compact-v1
  groq_max_completion_tokens: 1024
  machine_decision_schema: classification-v1
  machine_record_exclusions_path: data/labels/annotation/machine/reviews/record_exclusions.json
  excluded_machine_runs:
    c34713655e61fb0b06836a6724f2dd9834e3d8303bad1c188fdd4b0fd5fd7eea: unresolved policy inconsistency; preserve history but exclude from usable labels
  # RPM is an operator ceiling. TPM/RPD were observed live and may change.
  groq_rate:
    requests_per_minute: 5
    tokens_per_minute: 8000
    requests_per_day: 1000
  machine_rate:
    request_interval_seconds: 15
    max_retries: 2
    initial_backoff_seconds: 5
    max_backoff_seconds: 30
    jitter_seconds: 1
    max_single_wait_seconds: 30
    max_total_retry_wait_seconds: 60

artifacts:
  directory: artifacts
  processed_data_format: parquet
  human_labels_format: csv
  predictions_format: jsonl
